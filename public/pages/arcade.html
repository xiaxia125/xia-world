<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>XIA RUNNER · ARCADE</title>
    <meta name="theme-color" content="#07100c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307100c'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%23d8ff5f'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #07100c;
        --paper: #f1ecdf;
        --dim: rgba(241, 236, 223, 0.52);
        --faint: rgba(241, 236, 223, 0.18);
        --line: rgba(241, 236, 223, 0.14);
        --lime: #d8ff5f;
        --orange: #ff8a4c;
        --blue: #9fe6ff;
        --mono: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
        --display: "Arial Black", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        overflow-x: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--mono);
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.35;
        background-image: linear-gradient(to right, rgba(216, 255, 95, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(216, 255, 95, 0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at 50% 35%, black, transparent 78%);
      }

      a {
        color: inherit;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      .shell {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        width: min(1180px, 100%);
        min-height: 100dvh;
        margin: 0 auto;
        padding: 18px clamp(14px, 3vw, 30px) 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 16px;
        height: 16px;
        border: 1px solid var(--lime);
        background: var(--lime);
        box-shadow: 3px 3px 0 rgba(216, 255, 95, 0.2);
      }

      .brand b {
        font-weight: 700;
      }

      .brand span {
        color: var(--dim);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .chip-button,
      .close-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 34px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--dim);
        font-size: 8px;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }

      .chip-button:hover,
      .close-button:hover {
        border-color: var(--lime);
        color: var(--lime);
      }

      .close-button {
        background: var(--lime);
        border-color: var(--lime);
        color: var(--ink);
      }

      .close-button:hover {
        background: var(--paper);
        border-color: var(--paper);
        color: var(--ink);
      }

      .intro {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        padding: clamp(22px, 4vh, 40px) 0 18px;
      }

      .intro h1 {
        margin: 0;
        font-family: var(--display);
        font-size: clamp(38px, 6vw, 78px);
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.07em;
      }

      .intro h1 em {
        color: var(--lime);
        font-style: normal;
      }

      .intro p {
        max-width: 380px;
        margin: 0;
        color: var(--dim);
        font-family: sans-serif;
        font-size: 12px;
        line-height: 1.8;
      }

      .stage {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(216, 255, 95, 0.32);
        background: #050c08;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 30px 100px -50px rgba(216, 255, 95, 0.35);
        aspect-ratio: 16 / 9;
      }

      /* The same page is used standalone and inside the 3D overlay. */
      body.is-embedded {
        overflow: hidden;
      }

      body.is-embedded .shell {
        min-height: 100dvh;
        padding-top: 8px;
        padding-bottom: 10px;
      }

      body.is-embedded .topbar {
        padding-bottom: 8px;
      }

      body.is-embedded .intro {
        padding: 8px 0 10px;
      }

      body.is-embedded .intro h1 {
        font-size: clamp(28px, 3.6vw, 46px);
      }

      body.is-embedded .intro p {
        display: none;
      }

      body.is-embedded .stage {
        width: min(100%, calc((100dvh - 190px) * 16 / 9));
        margin-inline: auto;
        flex: 0 0 auto;
      }

      body.is-embedded .bottom {
        display: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      .scanlines {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        opacity: 0.16;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 2px,
          rgba(0, 0, 0, 0.55) 3px,
          rgba(0, 0, 0, 0.55) 4px
        );
        mix-blend-mode: multiply;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        box-shadow: inset 0 0 130px rgba(0, 0, 0, 0.68);
      }

      .game-hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 4;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        padding: clamp(12px, 2vw, 22px);
        pointer-events: none;
      }

      .score-block {
        display: flex;
        gap: 18px;
      }

      .score-item span {
        display: block;
        color: rgba(241, 236, 223, 0.45);
        font-size: 7px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .score-item b {
        display: block;
        margin-top: 3px;
        color: var(--lime);
        font-family: var(--mono);
        font-size: clamp(16px, 2.6vw, 26px);
        font-weight: 600;
        letter-spacing: 0.06em;
        line-height: 1;
        text-shadow: 0 0 16px rgba(216, 255, 95, 0.3);
      }

      .speed-block {
        color: rgba(241, 236, 223, 0.55);
        font-size: 8px;
        letter-spacing: 0.1em;
        text-align: right;
        text-transform: uppercase;
      }

      .speed-block b {
        color: var(--paper);
        font-weight: 500;
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 42%, rgba(7, 16, 12, 0.3), rgba(7, 16, 12, 0.88));
        transition: opacity 0.25s, visibility 0.25s;
      }

      .overlay.is-hidden {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .panel {
        width: min(520px, 100%);
        padding: clamp(22px, 4vw, 36px);
        border: 1px solid rgba(216, 255, 95, 0.34);
        background: rgba(7, 16, 12, 0.92);
        box-shadow: 9px 9px 0 rgba(216, 255, 95, 0.08);
        text-align: center;
      }

      .panel-kicker {
        margin: 0 0 12px;
        color: var(--lime);
        font-size: 8px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .panel h2 {
        margin: 0;
        font-family: var(--display);
        font-size: clamp(32px, 5vw, 54px);
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      .panel h2 em {
        color: var(--orange);
        font-style: normal;
      }

      .panel p {
        margin: 14px auto 0;
        max-width: 360px;
        color: var(--dim);
        font-family: sans-serif;
        font-size: 12px;
        line-height: 1.8;
      }

      .panel .score-line {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin: 22px 0 0;
        padding: 14px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .panel .score-line div span {
        display: block;
        color: var(--dim);
        font-size: 7px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .panel .score-line div b {
        display: block;
        margin-top: 5px;
        color: var(--lime);
        font-size: 24px;
        font-weight: 500;
      }

      .play-button {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 46px;
        margin-top: 22px;
        padding: 0 8px 0 20px;
        border: 1px solid var(--lime);
        border-radius: 999px;
        background: var(--lime);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        transition: transform 0.2s, background 0.2s;
      }

      .play-button span {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--lime);
        font-size: 14px;
      }

      .play-button:hover {
        background: var(--paper);
        border-color: var(--paper);
        transform: translateY(-2px);
      }

      .keys {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px 16px;
        margin-top: 20px;
        color: var(--dim);
        font-size: 8px;
        letter-spacing: 0.06em;
      }

      .keys kbd {
        display: inline-flex;
        align-items: center;
        height: 18px;
        padding: 0 5px;
        margin-right: 4px;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--paper);
        font-family: var(--mono);
        font-size: 8px;
      }

      .bottom {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding-top: 16px;
        color: var(--dim);
        font-size: 8px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .bottom-links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      .bottom a {
        text-decoration: none;
        color: var(--dim);
        transition: color 0.2s;
      }

      .bottom a:hover {
        color: var(--lime);
      }

      .touch-jump {
        display: none;
        position: absolute;
        right: 18px;
        bottom: 18px;
        z-index: 6;
        width: 76px;
        height: 76px;
        border: 1px solid rgba(216, 255, 95, 0.5);
        border-radius: 50%;
        background: rgba(216, 255, 95, 0.18);
        color: var(--lime);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        backdrop-filter: blur(6px);
      }

      @media (hover: none) and (pointer: coarse) {
        .touch-jump {
          display: block;
        }
      }

      @media (max-width: 720px) {
        .shell {
          padding: 12px 12px 18px;
        }

        .brand > b ~ span {
          display: none;
        }

        .intro {
          padding: 18px 0 14px;
        }

        .intro p {
          display: none;
        }

        .stage {
          aspect-ratio: 16 / 9;
        }

        /* The ready / game-over card has to fit inside a 16:9 phone stage. */
        .overlay {
          padding: 8px;
        }

        .panel {
          max-height: 100%;
          padding: 13px 15px;
          overflow-y: auto;
          overscroll-behavior: contain;
        }

        .panel-kicker {
          margin-bottom: 7px;
          font-size: 7px;
        }

        .panel h2 {
          font-size: 27px;
        }

        .panel p,
        .panel .keys {
          display: none;
        }

        .panel .score-line {
          margin-top: 10px;
          padding: 8px 0;
        }

        .panel .score-line div b {
          font-size: 19px;
        }

        .panel .play-button {
          height: 40px;
          margin-top: 11px;
          padding-left: 14px;
        }

        .overlay:not(.is-hidden) ~ .touch-jump {
          display: none;
        }

        .touch-jump {
          right: 12px;
          bottom: 12px;
          width: 62px;
          height: 62px;
        }

        .bottom {
          font-size: 7px;
        }

        .bottom-links {
          gap: 10px;
        }
      }

      /* Short landscape viewports: use the space above the cabinet for the
         game itself and keep the ready / game-over card compact. */
      @media (max-height: 620px) {
        body.is-embedded {
          overflow-y: auto;
        }

        body.is-embedded .intro {
          display: none;
        }

        body.is-embedded .stage {
          width: min(100%, max(420px, calc((100dvh - 70px) * 16 / 9)));
        }

        .overlay {
          padding: 6px;
        }

        .panel {
          max-height: 100%;
          padding: 10px 14px;
          overflow-y: auto;
          overscroll-behavior: contain;
        }

        .panel-kicker {
          display: none;
        }

        .panel h2 {
          font-size: 24px;
        }

        .panel p,
        .panel .keys {
          display: none;
        }

        .panel .score-line {
          margin-top: 8px;
          padding: 6px 0;
        }

        .panel .score-line div b {
          font-size: 19px;
        }

        .panel .play-button {
          height: 36px;
          margin-top: 8px;
          padding-left: 12px;
        }

        .overlay:not(.is-hidden) ~ .touch-jump {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <b>XIA HOME</b>
          <span>/ ARCADE 001</span>
        </div>
        <div class="top-actions">
          <a class="chip-button" href="index.html">2D 主页</a>
          <button id="sound-toggle" class="chip-button" type="button"><span>声音 ON</span></button>
          <button id="close-world" class="close-button" type="button">返回 3D <span aria-hidden="true">↗</span></button>
        </div>
      </header>

      <div class="intro">
        <h1>XIA<br /><em>RUNNER</em></h1>
        <p>
          一个藏在书架后面的小游戏。跳过木箱，收集发光的彩蛋。速度会越来越快，
          但你的最高分会留在这台设备上。
        </p>
      </div>

      <div class="stage" id="stage">
        <canvas id="game" width="960" height="540" aria-label="XIA RUNNER 游戏画面"></canvas>
        <div class="vignette" aria-hidden="true"></div>
        <div class="scanlines" aria-hidden="true"></div>

        <div class="game-hud" aria-hidden="true">
          <div class="score-block">
            <div class="score-item"><span>Score</span><b id="hud-score">000000</b></div>
            <div class="score-item"><span>Best</span><b id="hud-best">000000</b></div>
          </div>
          <div class="speed-block">Speed <b id="hud-speed">1.0×</b><br />Eggs <b id="hud-eggs">0</b></div>
        </div>

        <div class="overlay" id="overlay">
          <div class="panel">
            <p class="panel-kicker" id="panel-kicker">INSERT COIN / READY</p>
            <h2 id="panel-title">跑起来。<br /><em>别停。</em></h2>
            <p id="panel-text">跳过木箱，收集彩蛋。每 100 分速度会更快一点。</p>
            <div class="score-line" id="panel-scores" style="display: none">
              <div><span>Your score</span><b id="final-score">0</b></div>
              <div><span>Personal best</span><b id="final-best">0</b></div>
            </div>
            <button id="start-button" class="play-button" type="button">
              <span aria-hidden="true">▶</span><b id="start-label">开始奔跑</b>
            </button>
            <div class="keys">
              <span><kbd>SPACE</kbd>跳跃</span>
              <span><kbd>P</kbd>暂停</span>
              <span><kbd>ESC</kbd>返回世界</span>
            </div>
          </div>
        </div>

        <button id="touch-jump" class="touch-jump" type="button">JUMP</button>
      </div>

      <footer class="bottom">
        <span>XIA RUNNER / A SMALL GAME INSIDE XIA HOME</span>
        <div class="bottom-links">
          <a href="index.html">← 返回 2D 主页</a>
          <a href="cinema.html">天台影院 →</a>
        </div>
      </footer>
    </div>

    <script>
      (() => {
        if (window.self !== window.top) document.body.classList.add("is-embedded");

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const overlay = document.getElementById("overlay");
        const panelKicker = document.getElementById("panel-kicker");
        const panelTitle = document.getElementById("panel-title");
        const panelText = document.getElementById("panel-text");
        const panelScores = document.getElementById("panel-scores");
        const finalScore = document.getElementById("final-score");
        const finalBest = document.getElementById("final-best");
        const startButton = document.getElementById("start-button");
        const startLabel = document.getElementById("start-label");
        const hudScore = document.getElementById("hud-score");
        const hudBest = document.getElementById("hud-best");
        const hudSpeed = document.getElementById("hud-speed");
        const hudEggs = document.getElementById("hud-eggs");
        const soundButton = document.getElementById("sound-toggle");

        const W = 960;
        const H = 540;
        const GROUND = 432;
        const BEST_KEY = "xia-home-arcade-best";

        let best = Number(localStorage.getItem(BEST_KEY) || 0);
        let soundOn = true;
        let audioCtx = null;
        let last = performance.now();
        let raf = 0;
        let shake = 0;
        let flash = 0;
        let mode = "ready";
        let score = 0;
        let distance = 0;
        let speed = 300;
        let eggsCollected = 0;
        let spawnTimer = 0.8;
        let eggTimer = 2.2;
        let elapsed = 0;
        let obstacles = [];
        let eggs = [];
        let particles = [];
        let clouds = [];
        let player = { x: 170, y: GROUND - 58, w: 36, h: 58, vy: 0, onGround: true, jumps: 0 };

        for (let i = 0; i < 7; i += 1) {
          clouds.push({ x: Math.random() * W, y: 70 + Math.random() * 150, s: 0.6 + Math.random() * 1.1 });
        }

        function fmt(n) {
          return String(Math.max(0, Math.floor(n))).padStart(6, "0");
        }

        function setBest(value) {
          best = Math.max(best, Math.floor(value));
          localStorage.setItem(BEST_KEY, String(best));
          hudBest.textContent = fmt(best);
        }

        function setHud() {
          hudScore.textContent = fmt(score);
          hudBest.textContent = fmt(best);
          hudEggs.textContent = String(eggsCollected);
          hudSpeed.textContent = (speed / 300).toFixed(1) + "×";
        }

        function tone(freq, duration, type = "square", volume = 0.035, slide = 0) {
          if (!soundOn) return;
          if (!audioCtx) {
            const Context = window.AudioContext || window.webkitAudioContext;
            if (!Context) return;
            audioCtx = new Context();
          }
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), now + duration);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        }

        function jump() {
          if (mode === "ready" || mode === "over") {
            start();
            return;
          }
          if (mode !== "playing") return;
          if (player.onGround) {
            player.vy = -790;
            player.onGround = false;
            player.jumps = 1;
            tone(300, 0.12, "square", 0.035, 180);
          } else if (player.jumps < 2) {
            player.vy = -670;
            player.jumps = 2;
            tone(420, 0.1, "triangle", 0.028, 140);
            for (let i = 0; i < 8; i += 1) {
              particles.push({ x: player.x + 18, y: player.y + player.h, vx: (Math.random() - 0.5) * 120, vy: Math.random() * 80, life: 0.35, color: "#9fe6ff", size: 3 });
            }
          }
        }

        function start() {
          mode = "playing";
          score = 0;
          distance = 0;
          speed = 300;
          eggsCollected = 0;
          spawnTimer = 0.85;
          eggTimer = 2.2;
          obstacles = [];
          eggs = [];
          particles = [];
          player = { x: 170, y: GROUND - 58, w: 36, h: 58, vy: 0, onGround: true, jumps: 0 };
          overlay.classList.add("is-hidden");
          last = performance.now();
          setHud();
          tone(520, 0.09, "square", 0.03, 160);
          window.setTimeout(() => tone(780, 0.12, "square", 0.025), 90);
        }

        function gameOver() {
          if (mode !== "playing") return;
          mode = "over";
          setBest(score);
          setHud();
          shake = 1;
          flash = 0.5;
          tone(120, 0.3, "sawtooth", 0.05, -80);
          finalScore.textContent = String(Math.floor(score));
          finalBest.textContent = String(best);
          panelKicker.textContent = "SIGNAL LOST / GAME OVER";
          panelTitle.innerHTML = "撞上了。<br /><em>再来一次。</em>";
          panelText.textContent = "木箱不会动，但速度会。下一次记得在落地前起跳。";
          panelScores.style.display = "flex";
          startLabel.textContent = "再跑一次";
          overlay.classList.remove("is-hidden");
        }

        function togglePause() {
          if (mode === "playing") {
            mode = "paused";
            panelKicker.textContent = "PAUSED / STILL HERE";
            panelTitle.innerHTML = "暂停。<br /><em>喘口气。</em>";
            panelText.textContent = "按 P 或点击按钮继续。世界还在外面等你。";
            panelScores.style.display = "none";
            startLabel.textContent = "继续奔跑";
            overlay.classList.remove("is-hidden");
          } else if (mode === "paused") {
            mode = "playing";
            overlay.classList.add("is-hidden");
            last = performance.now();
          }
        }

        function spawnObstacle() {
          const double = Math.random() < 0.22 && speed > 360;
          const height = 38 + Math.random() * 20;
          obstacles.push({
            x: W + 60,
            y: GROUND - height,
            w: double ? 64 : 36,
            h: height,
            double,
          });
          spawnTimer = Math.max(0.55, 1.02 - distance * 0.00006) * (0.9 + Math.random() * 0.25);
        }

        function spawnEgg() {
          eggs.push({
            x: W + 60,
            y: GROUND - 120 - Math.random() * 110,
            size: 20,
            phase: Math.random() * 6.28,
          });
          eggTimer = 2.6 + Math.random() * 2.2;
        }

        function hitRect(ax, ay, aw, ah, bx, by, bw, bh) {
          return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
        }

        function update(dt) {
          elapsed += dt;
          if (mode !== "playing") {
            shake = Math.max(0, shake - dt * 2.5);
            flash = Math.max(0, flash - dt * 2.4);
            particles.forEach((p) => {
              p.life -= dt;
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy += 500 * dt;
            });
            particles = particles.filter((p) => p.life > 0);
            return;
          }

          distance += speed * dt;
          speed = Math.min(620, 300 + distance * 0.011);
          score = Math.floor(distance / 12) + eggsCollected * 25;

          player.vy += 2250 * dt;
          player.y += player.vy * dt;
          if (player.y + player.h >= GROUND) {
            player.y = GROUND - player.h;
            player.vy = 0;
            player.onGround = true;
            player.jumps = 0;
          }

          spawnTimer -= dt;
          if (spawnTimer <= 0) spawnObstacle();
          eggTimer -= dt;
          if (eggTimer <= 0) spawnEgg();

          obstacles.forEach((o) => (o.x -= speed * dt));
          eggs.forEach((e) => (e.x -= speed * dt));

          for (const o of obstacles) {
            if (hitRect(player.x + 4, player.y + 3, player.w - 8, player.h - 4, o.x, o.y, o.w, o.h)) {
              gameOver();
              break;
            }
          }

          for (const e of eggs) {
            if (e.dead) continue;
            const cx = e.x + e.size / 2;
            const cy = e.y + e.size / 2 + Math.sin(elapsed * 4 + e.phase) * 5;
            if (hitRect(player.x, player.y, player.w, player.h, cx - e.size / 2, cy - e.size / 2, e.size, e.size)) {
              e.dead = true;
              eggsCollected += 1;
              score += 25;
              tone(980, 0.1, "triangle", 0.04, 220);
              for (let i = 0; i < 10; i += 1) {
                particles.push({ x: cx, y: cy, vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.8) * 220, life: 0.5, color: i % 2 ? "#d8ff5f" : "#ffffff", size: 3 + Math.random() * 3 });
              }
            }
          }

          obstacles = obstacles.filter((o) => o.x + o.w > -40);
          eggs = eggs.filter((e) => !e.dead && e.x + e.size > -40);
          particles.forEach((p) => {
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 500 * dt;
          });
          particles = particles.filter((p) => p.life > 0);

          clouds.forEach((c) => {
            c.x -= speed * dt * 0.02 * c.s;
            if (c.x < -110) {
              c.x = W + Math.random() * 180;
              c.y = 70 + Math.random() * 150;
            }
          });

          shake = Math.max(0, shake - dt * 2.5);
          flash = Math.max(0, flash - dt * 2.4);
          setHud();
        }

        function drawBackground() {
          const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
          sky.addColorStop(0, "#0b1b29");
          sky.addColorStop(0.58, "#294454");
          sky.addColorStop(1, "#d2765d");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, W, GROUND);

          // Sun.
          const sunX = 760;
          const sunY = 190;
          const glow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 150);
          glow.addColorStop(0, "rgba(255,225,163,0.5)");
          glow.addColorStop(1, "rgba(255,225,163,0)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, W, GROUND);
          ctx.fillStyle = "#ffe1a3";
          ctx.fillRect(sunX - 42, sunY - 42, 84, 84);

          // Far skyline.
          ctx.fillStyle = "rgba(11, 25, 28, 0.6)";
          const farOffset = (distance * 0.06) % 240;
          for (let i = -1; i < 7; i += 1) {
            const x = i * 200 - farOffset;
            const heights = [80, 132, 56, 110, 78, 150];
            for (let j = 0; j < 6; j += 1) {
              const w = 28 + ((i + j + 9) % 3) * 12;
              const h = heights[(i + j + 6) % heights.length];
              ctx.fillRect(x + j * 33, GROUND - h, w, h);
            }
          }

          // Pixel clouds.
          for (const c of clouds) {
            ctx.fillStyle = "rgba(241,236,223,0.12)";
            const s = c.s;
            ctx.fillRect(c.x, c.y, 46 * s, 8 * s);
            ctx.fillRect(c.x + 10 * s, c.y - 8 * s, 26 * s, 8 * s);
          }

          // Ground.
          ctx.fillStyle = "#07100c";
          ctx.fillRect(0, GROUND, W, H - GROUND);
          ctx.fillStyle = "#d8ff5f";
          ctx.fillRect(0, GROUND, W, 3);
          ctx.strokeStyle = "rgba(216,255,95,0.15)";
          ctx.lineWidth = 1;
          const groundOffset = (distance * 0.7) % 64;
          for (let x = -groundOffset; x < W; x += 64) {
            ctx.beginPath();
            ctx.moveTo(x, GROUND + 3);
            ctx.lineTo(x - 50, H);
            ctx.stroke();
          }
          ctx.strokeStyle = "rgba(216,255,95,0.12)";
          for (let y = GROUND + 34; y < H; y += 34) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
          }
        }

        function drawCrate(o) {
          ctx.fillStyle = "#3b3021";
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.strokeStyle = "#b98a55";
          ctx.lineWidth = 2;
          ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
          ctx.strokeStyle = "rgba(216,255,95,0.55)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(o.x + 5, o.y + 5);
          ctx.lineTo(o.x + o.w - 5, o.y + o.h - 5);
          ctx.moveTo(o.x + o.w - 5, o.y + 5);
          ctx.lineTo(o.x + 5, o.y + o.h - 5);
          ctx.stroke();
          ctx.fillStyle = "rgba(255,138,76,0.9)";
          ctx.fillRect(o.x + o.w - 9, o.y + 6, 3, 3);
        }

        function drawPlayer() {
          const bob = player.onGround ? Math.sin(elapsed * 18) * 1.5 : 0;
          const x = player.x;
          const y = player.y + bob;
          const leg = player.onGround ? Math.sin(elapsed * 22) * 7 : 2;

          // Shadow.
          ctx.fillStyle = "rgba(0,0,0,0.28)";
          ctx.fillRect(x + 4, GROUND - 4, player.w, 4);

          // Legs.
          ctx.fillStyle = "#1b2a20";
          ctx.fillRect(x + 8, y + 42, 8, 16 + leg);
          ctx.fillRect(x + 22, y + 42, 8, 16 - leg);
          // Body.
          ctx.fillStyle = "#d8ff5f";
          ctx.fillRect(x + 4, y + 18, 28, 26);
          // Head.
          ctx.fillStyle = "#f1ecdf";
          ctx.fillRect(x + 9, y, 22, 22);
          ctx.fillStyle = "#07100c";
          ctx.fillRect(x + 23, y + 7, 4, 4);
          // Scarf.
          ctx.fillStyle = "#ff8a4c";
          ctx.fillRect(x + 2, y + 19, 32, 5);
          ctx.fillRect(x - 7 + Math.sin(elapsed * 11) * 3, y + 22, 12, 4);
          // Arm.
          ctx.fillStyle = "#c6e94f";
          ctx.fillRect(x + 30, y + 24, 8, 6 + Math.sin(elapsed * 18) * 3);
        }

        function drawEgg(e) {
          const y = e.y + Math.sin(elapsed * 4 + e.phase) * 5;
          const glow = ctx.createRadialGradient(e.x + 10, y + 10, 2, e.x + 10, y + 10, 40);
          glow.addColorStop(0, "rgba(216,255,95,0.4)");
          glow.addColorStop(1, "rgba(216,255,95,0)");
          ctx.fillStyle = glow;
          ctx.fillRect(e.x - 30, y - 30, 80, 80);
          ctx.fillStyle = "#d8ff5f";
          ctx.fillRect(e.x, y, e.size, e.size);
          ctx.strokeStyle = "#07100c";
          ctx.lineWidth = 2;
          ctx.strokeRect(e.x + 1, y + 1, e.size - 2, e.size - 2);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(e.x + 5, y + 4, 4, 4);
        }

        function draw() {
          ctx.save();
          if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10);
          }
          drawBackground();
          obstacles.forEach(drawCrate);
          eggs.forEach(drawEgg);
          drawPlayer();
          for (const p of particles) {
            ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.5));
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
          ctx.globalAlpha = 1;

          if (mode === "paused") {
            ctx.fillStyle = "rgba(7,16,12,0.35)";
            ctx.fillRect(0, 0, W, H);
          }
          if (flash > 0) {
            ctx.fillStyle = `rgba(255,138,76,${flash * 0.5})`;
            ctx.fillRect(0, 0, W, H);
          }
          ctx.restore();
        }

        function loop(now) {
          raf = requestAnimationFrame(loop);
          const dt = Math.min((now - last) / 1000, 0.033);
          last = now;
          update(dt);
          draw();
        }

        function handleStart() {
          if (mode === "paused") togglePause();
          else start();
        }

        startButton.addEventListener("click", handleStart);
        document.addEventListener("keydown", (event) => {
          if (event.code === "Space" || event.code === "ArrowUp" || event.code === "KeyW") {
            event.preventDefault();
            jump();
          } else if (event.code === "KeyP") {
            event.preventDefault();
            togglePause();
          } else if (event.code === "Escape") {
            closeWorld();
          }
        });
        canvas.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          jump();
        });
        document.getElementById("touch-jump").addEventListener("pointerdown", (event) => {
          event.preventDefault();
          jump();
        });
        soundButton.addEventListener("click", () => {
          soundOn = !soundOn;
          soundButton.querySelector("span").textContent = soundOn ? "声音 ON" : "声音 OFF";
          if (soundOn) {
            if (!audioCtx) {
              const Context = window.AudioContext || window.webkitAudioContext;
              audioCtx = Context ? new Context() : null;
            }
            tone(660, 0.08, "square", 0.025, 120);
          }
        });

        function closeWorld() {
          if (window.parent !== window) {
            window.parent.postMessage("xia-home:close-2d", "*");
          } else {
            window.location.href = "../";
          }
        }

        document.getElementById("close-world").addEventListener("click", closeWorld);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden" && mode === "playing") togglePause();
        });

        setBest(0);
        setHud();
        draw();
        raf = requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
